<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- ?v= is cache-busting. Telegram keeps the Mini App in its WebView cache. -->
    <link rel="stylesheet" href="style.css?v=2026-09-12c">
    <title>GAUDI</title>
  </head>
  <body>
    <main class="panel" aria-live="polite">
      <p class="eyebrow panel-title" id="app-title"></p>
      <header class="profile" id="profile">
        <div class="profile-row">
          <h1 id="user-name"></h1>
          <span class="role-badge" id="user-role"></span>
        </div>
        <div class="today-metric">
          <strong id="dialog-count"></strong>
          <span id="metric-label"></span>
        </div>
      </header>
      <nav class="tabs" id="tabs" aria-label="Sections" hidden>
        <button class="chip" id="dashboard-tab" type="button" aria-pressed="true"></button>
        <button class="chip" id="settings-tab" type="button" aria-pressed="false"></button>
      </nav>
      <section class="feedback" id="feedback" hidden>
        <p id="message" role="alert"></p>
        <button id="retry" type="button" hidden></button>
      </section>
      <form class="filters" id="filters" hidden>
        <fieldset>
          <legend id="period-label"></legend>
          <div class="chips" id="period-chips"></div>
        </fieldset>
        <div class="custom-dates" id="custom-dates" hidden>
          <label><span id="from-label"></span><input id="date-from" type="date"></label>
          <label><span id="to-label"></span><input id="date-to" type="date"></label>
        </div>
        <p class="filter-error" id="filter-error" role="alert" hidden></p>
        <div class="select-row">
          <label><span id="channel-label"></span><select id="channel"></select></label>
          <label id="manager-wrap" hidden><span id="manager-label"></span><select id="manager"></select></label>
        </div>
      </form>
      <div class="dashboard" id="dashboard" hidden></div>
      <section class="settings-panel" id="settings-panel" hidden></section>
    </main>
    <script src="app.js?v=2026-09-12c"></script>
  </body>
</html>
